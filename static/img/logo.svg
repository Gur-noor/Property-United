<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bldg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E86FF"/>
      <stop offset="100%" stop-color="#1a6fdd"/>
    </linearGradient>
    <linearGradient id="roof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5ba4ff"/>
      <stop offset="100%" stop-color="#2E86FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="120" height="120" rx="24" fill="#05070E"/>
  <!-- Subtle inner border -->
  <rect width="120" height="120" rx="24" fill="none" stroke="#2E86FF" stroke-width="1" opacity="0.18"/>

  <!-- Building body -->
  <rect x="34" y="52" width="52" height="42" rx="2" fill="url(#bldg)"/>

  <!-- Roof / gable peak -->
  <path d="M27 53 L60 24 L93 53" fill="none" stroke="url(#roof)" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Door -->
  <rect x="51" y="67" width="18" height="27" rx="2.5" fill="#05070E"/>

  <!-- Windows top row -->
  <rect x="38" y="57" width="11" height="9" rx="2" fill="rgba(255,255,255,0.55)"/>
  <rect x="71" y="57" width="11" height="9" rx="2" fill="rgba(255,255,255,0.55)"/>

  <!-- Windows lower row -->
  <rect x="38" y="72" width="11" height="9" rx="2" fill="rgba(255,255,255,0.28)"/>
  <rect x="71" y="72" width="11" height="9" rx="2" fill="rgba(255,255,255,0.28)"/>

  <!-- Blockchain node dots -->
  <circle cx="24" cy="38" r="4"   fill="#5ba4ff" opacity="0.85"/>
  <circle cx="96" cy="38" r="4"   fill="#5ba4ff" opacity="0.85"/>
  <circle cx="60" cy="16" r="3.5" fill="#2E86FF" opacity="0.9"/>

  <!-- Connector lines -->
  <line x1="27" y1="39" x2="54" y2="28" stroke="#5ba4ff" stroke-width="1.2"
        stroke-dasharray="3 2.5" opacity="0.5"/>
  <line x1="93" y1="39" x2="66" y2="28" stroke="#5ba4ff" stroke-width="1.2"
        stroke-dasharray="3 2.5" opacity="0.5"/>
</svg>
